input {
  tcp {
    port => 5000
    codec => json_lines {}
  }
}

filter {
  mutate { uppercase => ["level"] }
  if [level] in ["ERROR", "CRITICAL"] {
    mutate { add_field => { "[@metadata][target_index]" => "django-logs-errors-%{+YYYY.MM.dd}" } }
  } else if [level] == "WARNING" {
    mutate { add_field => { "[@metadata][target_index]" => "django-logs-warnings-%{+YYYY.MM.dd}" } }
  } else {
    mutate { add_field => { "[@metadata][target_index]" => "django-logs-info-%{+YYYY.MM.dd}" } }
  }
}

output {
  stdout { codec => rubydebug { metadata => true } }
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
}