[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/config"
explicit_package_bases = true
exclude = ["migrations/", "my_test\\.py"]

[tool.django-stubs]
django_settings_module = "config.settings"

