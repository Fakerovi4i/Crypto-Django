on:
  pull_request:
  push:
  workflow_dispatch:

env:
  SECRET_KEY: "ci-test-secret-key-not-for-prod"
  DEBUG: "False"
  DB_NAME: testdb
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: "5432"
  CELERY_BROKER_URL: redis://127.0.0.1:6379/0
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
  DEFAULT_CACHE: redis://127.0.0.1:6379/2
  THROTTLING_CACHE: redis://127.0.0.1:6379/3
  EXCHANGE_PROVIDER: coingecko
  API_KEY: "test-api-key-not-real"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy --no-incremental .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: |
          cd config
          python manage.py migrate

      - name: Run unit tests
        run: |
          cd config
          python manage.py test crypto.tests.unit --failfast --settings=config.settings_test

      - name: Run integration tests
        run: |
          cd config
          python manage.py test crypto.tests.integration --failfast --settings=config.settings_test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - "5432:5432"
