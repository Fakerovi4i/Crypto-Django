services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    networks:
      - dbnet
      - monitoring
    ports:
      - "80:80"
    volumes:
      - staticfiles:/app/config/staticfiles
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - crypto_app


  crypto_app:
    build: .
    image: crypto_app
    pull_policy: build
    container_name: crypto_app
    restart: always
    command: >
      sh -c "rm -rf $${PROMETHEUS_MULTIPROC_DIR} &&
      mkdir -p $${PROMETHEUS_MULTIPROC_DIR} &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000 --workers 2 --no-control-socket
      --access-logfile - --error-logfile -"
    env_file:
      - .env
    networks:
      elk:
      dbnet:
      monitoring:
        aliases:
          - crypto-app
    volumes:
      - ./config:/app/config
      - staticfiles:/app/config/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-bookworm
    container_name: postgres
    restart: always
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - dbnet

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - dbnet
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    image: crypto_app
    pull_policy: build
    container_name: celery
    command: celery -A config worker -l info --concurrency=3
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dbnet
      - elk

  celery-beat:
    image: crypto_app
    pull_policy: build
    container_name: celery-beat
    command: celery -A config beat -l info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dbnet

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    expose:
      - "9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'  # 8+ дней истории
      - '--web.enable-lifecycle'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/prometheus/'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=/grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - monitoring

  elasticsearch:
    image: elasticsearch:8.19.23
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./docker/elasticsearch/config.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    environment:
      ES_JAVA_OPTS: "-Xmx512m -Xms512m"
      discovery.type: single-node
      ELASTIC_PASSWORD: "1234"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - elk
    ports:
      - "127.0.0.1:9200:9200"

  logstash:
    image: logstash:8.19.23
    volumes:
      - ./docker/logstash/config.yml:/usr/share/logstash/logstash.yml:ro
      - ./docker/logstash/pipelines.yml:/usr/share/logstash/pipelines.yml:ro
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline/:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      LS_JAVA_OPTS: "-Xmx512m -Xms512m"
    ports:
      - "127.0.0.1:9600:9600"
    networks:
      - elk
    depends_on:
      - elasticsearch

  kibana:
    image: kibana:8.19.23
    depends_on:
      - elasticsearch
    volumes:
      - ./docker/kibana/config.yml:/usr/share/kibana/config/kibana.yml:ro
    networks:
      - elk
    ports:
      - "5601:5601"



networks:
  dbnet:
    driver: bridge

  monitoring:
    driver: bridge

  elk:
    driver: bridge

volumes:
  postgres_data:
  staticfiles:

  prometheus_data:
  grafana_data:

  elasticsearch_data: